# Production-style local stack. Builds the app image with the multi-stage
# Dockerfile and runs MongoDB alongside.
#
#   cp .env.example .env.docker   # then edit secrets
#   docker compose up --build
#
# App at http://localhost:3000, Mongo at mongodb://localhost:27017/det.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: det:latest
    container_name: det-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      MONGO_URI: mongodb://mongo:27017/det
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mongo:
    image: mongo:7
    container_name: det-mongo
    restart: unless-stopped
    command: ["mongod", "--quiet", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
    name: det-mongo-data
