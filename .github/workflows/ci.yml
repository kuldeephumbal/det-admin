name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Test-time env (kept innocuous on purpose — these are not production secrets).
  JWT_ACCESS_SECRET: ci_access_secret_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  JWT_REFRESH_SECRET: ci_refresh_secret_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  CRON_SECRET: ci_cron_secret_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  BCRYPT_SALT_ROUNDS: '4'
  LOG_LEVEL: error

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests
        env:
          # mongo-memory-server downloads a Mongo binary on first run;
          # cache it across CI runs.
          MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Admin E2E (no DB)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build the app
        run: npm run build

      - name: Run Playwright smokes
        # No Mongo in this job — the default specs mock the session API
        # and the auth-flow spec skips when E2E_ADMIN_EMAIL is unset.
        # The webServer in playwright.config.js starts `npm run dev` if
        # nothing is serving the baseURL yet.
        run: npm run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Build & push image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
